<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fee Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #f4f6f9;
    color: #333;
}

/* =====================================================
    HEADER & BANNER STYLE
===================================================== */
.header {
    background: linear-gradient(135deg, #ff6600, #ff8533);
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    border-bottom: 3px solid #e55c00;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-logo {
    height: 75px;
    width: auto;
    object-fit: contain;
    background: white;
    padding: 2px;
}

.logo-text-container {
    display: flex;
    flex-direction: column;
}

.badge {
    background: #0044cc;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    width: fit-content;
    margin-top: 2px;
}

.back-btn {
    background: #cc0000;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.2s;
}

.back-btn:hover {
    background: #a80000;
}

/* =====================================================
    MAIN
===================================================== */
.container {
    max-width: 1400px;
    margin: 30px auto;
    padding: 0 20px;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 15px;
}

.title-area {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 600;
}

.actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

/* =====================================================
    BUTTONS
===================================================== */
.btn-whatsapp {
    background: #25d366;
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 7px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: .2s;
}

.btn-whatsapp:hover {
    background: #1ebe5d;
    transform: translateY(-1px);
}

.btn-activate {
    background: #0044cc;
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 7px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: .2s;
}

.btn-activate:hover {
    background: #003399;
    transform: translateY(-1px);
}

.btn-refresh {
    background: #28a745;
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 7px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
}

.btn-refresh:hover {
    background: #218838;
}

.btn-refresh:disabled {
    opacity: .7;
    cursor: wait;
}

/* =====================================================
    SEARCH
===================================================== */
.search-box {
    padding: 9px 14px;
    width: 250px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 14px;
    outline: none;
}

.search-box:focus {
    border-color: #ff6600;
    box-shadow: 0 0 0 2px rgba(255,102,0,.1);
}

/* =====================================================
    TABLE
===================================================== */
.table-container {
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th {
    background: #f8f9fa;
    color: #444;
    padding: 12px 8px;
    font-size: 12px;
    text-transform: uppercase;
    border-bottom: 2px solid #dee2e6;
}

td {
    padding: 7px 6px;
    border-bottom: 1px solid #eee;
    font-size: 12px;
    vertical-align: middle;
}

/* =====================================================
    COLUMN WIDTHS
===================================================== */
th:nth-child(1), td:nth-child(1) { width: 90px; }
th:nth-child(2), td:nth-child(2) { width: 90px; }
th:nth-child(3), td:nth-child(3) { width: 190px; text-align: left !important; }
th:nth-child(4), td:nth-child(4) { width: 105px; text-align: center !important; }
th:nth-child(5), td:nth-child(5) { width: 90px; text-align: center !important; }
th:nth-child(6), td:nth-child(6) { width: 105px; text-align: center !important; }
th:nth-child(7), td:nth-child(7) { width: 65px; min-width: 65px; max-width: 65px; text-align: center !important; }
th:nth-child(8), td:nth-child(8) { width: 150px; text-align: center !important; }

td:nth-child(1), td:nth-child(2), td:nth-child(3) {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =====================================================
    DAYS
===================================================== */
.text-red {
    color: #d9534f;
    font-weight: 700;
}

.text-orange {
    color: #f0ad4e;
    font-weight: 700;
}

.text-green {
    color: #198754;
    font-weight: 700;
    background: #e8f5e9;
    padding: 3px 7px;
    border-radius: 4px;
    display: inline-block;
}

/* =====================================================
    ACTION WRAPPER & BUTTONS
===================================================== */
.action-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    flex-wrap: wrap;
}

.whatsapp-notify-btn {
    background: #25d366;
    color: white;
    border: none;
    padding: 4px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 10px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    transition: all .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
}

.whatsapp-notify-btn:hover {
    background: #1ebe5d;
    transform: translateY(-1px);
}

.inactive-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 4px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 10px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: .2s;
}

.inactive-btn:hover {
    background: #b02a37;
    transform: translateY(-1px);
}

.active-action-btn {
    background: #0044cc;
    color: white;
    border: none;
    padding: 4px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 10px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: .2s;
}

.active-action-btn:hover {
    background: #003399;
}

.active-action-btn:disabled {
    opacity: .6;
    cursor: wait;
}

/* =====================================================
    MODAL STYLE FOR MEMBER ACTIVATION
===================================================== */
.activation-modal {
    display: none;
    position: fixed;
    z-index: 9998;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
}

.activation-modal-content {
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 95%;
    max-width: 1000px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
}

.modal-header h3 {
    font-size: 16px;
    color: #333;
}

.close-modal-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 600;
}

.activation-table-container {
    overflow-y: auto;
    max-height: 60vh;
}

.small-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
}

.small-table th {
    background: #f1f3f5;
    padding: 8px 6px;
    font-size: 11px;
    text-align: left;
}

.small-table td {
    padding: 6px;
    font-size: 11px;
    border-bottom: 1px solid #eee;
}

/* =====================================================
    MOBILE RESPONSIVE
===================================================== */
@media(max-width:768px) {
    .header { padding: 10px 15px; }
    .header-logo { height: 35px; }
    .badge { display: none; }
    .actions { width: 100%; }
    .search-box { width: 100%; }
    .actions button { flex: 1; }
    .table-container { overflow-x: auto; }
    table { min-width: 900px; }
}
</style>
</head>

<body>

<!-- =====================================================
    HEADER
===================================================== -->
<div class="header">
    <div class="logo-area">
        <img src="logo.png" alt="Eminence Library Logo" class="header-logo">
        <div class="logo-text-container">
            <span class="badge">FEE MANAGEMENT PORTAL</span>
        </div>
    </div>
    <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> BACK</button>
</div>

<!-- =====================================================
    MAIN
===================================================== -->
<div class="container">
    <div class="toolbar">
        <div class="title-area">
            <i class="fa-solid fa-users-gear" style="color:#ff6600;"></i>
            Eminence Library - Fee Tracker
        </div>

        <div class="actions">
            <button class="btn-activate" onclick="openActivationModal()">
                <i class="fa-solid fa-user-check"></i> Member Activation
            </button>
            <button class="btn-whatsapp" onclick="generateBulkWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> Bulk Alerts
            </button>
            <input type="text" id="searchInput" class="search-box" placeholder="Filter by Branch, Name, Reg No..." oninput="filterTable()">
            <button id="refreshBtn" class="btn-refresh" onclick="loadData(true)">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
        </div>
    </div>

    <!-- =================================================
         TABLE
    ================================================ -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Branch Name</th>
                    <th>Reg No.</th>
                    <th>Name</th>
                    <th>Mobile Number</th>
                    <th>Date</th>
                    <th>Last Expiry Date</th>
                    <th>Days Left</th>
                    <th>Notify / Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="8" style="text-align:center;padding:20px;">
                        Loading data from Google Sheet...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- =====================================================
    MEMBER ACTIVATION MODAL (POPUP)
===================================================== -->
<div id="activationModal" class="activation-modal">
    <div class="activation-modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-user-check" style="color:#0044cc;"></i> Member Activation List</h3>
            <button class="close-modal-btn" onclick="closeActivationModal()">Close</button>
        </div>
        
        <!-- Search Box Added Here -->
        <div style="margin-bottom: 12px;">
            <input type="text" id="activationSearchInput" class="search-box" placeholder="Search by Branch, Name, Reg No, Mobile..." style="width: 100%;" oninput="filterActivationTable()">
        </div>

        <div class="activation-table-container">
            <table class="small-table">
                <thead>
                    <tr>
                        <th>Branch</th>
                        <th>Reg No.</th>
                        <th>Name</th>
                        <th>Mobile</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="activationTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center;padding:20px;">Loading master records...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- =====================================================
    CUSTOM CONFIRMATION MODAL
===================================================== -->
<div id="customModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
    <div style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
        <div style="font-size: 40px; color: #ff6600; margin-bottom: 15px;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h3 style="font-size: 18px; font-weight: 600; color: #333; margin-bottom: 10px;">Bulk Alert Confirmation</h3>
        <p id="modalMessage" style="font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.5;"></p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button id="modalNoBtn" style="background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; flex: 1;">No (Cancel)</button>
            <button id="modalYesBtn" style="background: #25d366; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; flex: 1;">Yes (Proceed)</button>
        </div>
    </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbydTaBhTq__3VJDvUgGWcSeU9aLBHnhUDYq_J5R3vjtlGWUQZODnujt1UGLx9BEFG8z/exec";
const INACTIVE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyevfLj9kN07KG-dAw3TdLPI6nheUedgisMsdRZGn-xaeqtkDZ4NAqU6gjNf_xx2Eco/exec";

const GET_ACTIVATION_URL = "https://script.google.com/macros/s/AKfycbzYaqXrLJqAxLFeNDNo41aDGiOM5w1lJ-sifCYph_ETvN3h4pLDSxDXG4VNYHTM9D9T/exec";
const POST_ACTIVATION_URL = "https://script.google.com/macros/s/AKfycbxyTxqHWQQVA6aTOSVA2Ino5AVJ-cak4G502ddDfd3uJUeGfG2s2GLH9QdJGHq06fxk/exec";

window.allData = [];
window.activationData = [];

function loadData(isRefresh = false) {
    const tbody = document.getElementById("tableBody");
    const refreshBtn = document.getElementById("refreshBtn");

    if (isRefresh) {
        refreshBtn.disabled = true;
        refreshBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Refreshing...';
    }

    tbody.innerHTML = `
        <tr>
            <td colspan="8" style="text-align:center;padding:20px;">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading fresh data...
            </td>
        </tr>
    `;

    const url = WEB_APP_URL + "?action=getMembers&t=" + Date.now();

    fetch(url, { method: "GET", cache: "no-store" })
    .then(function(response) {
        if (!response.ok) throw new Error("HTTP error " + response.status);
        return response.json();
    })
    .then(function(data) {
        if (data && !Array.isArray(data)) {
            if (data.status === "error") throw new Error(data.message || "Google Sheet API error.");
            throw new Error("Invalid API response.");
        }

        window.allData = Array.isArray(data) ? data : [];

        window.allData.sort(function(a, b) {
            let daysA = Number(a.daysLeft);
            let daysB = Number(b.daysLeft);
            if (isNaN(daysA)) daysA = Infinity;
            if (isNaN(daysB)) daysB = Infinity;
            return daysA - daysB;
        });

        displayTable(window.allData);
    })
    .catch(function(error) {
        console.error("Fee Tracker error:", error);
        tbody.innerHTML = `
            <tr>
                <td colspan="8" style="text-align:center;color:#dc3545;padding:25px;">
                    <i class="fa-solid fa-triangle-exclamation"></i><br>
                    <b>Error loading data</b><br>
                    <small>${escapeHtml(error.message)}</small>
                </td>
            </tr>
        `;
    })
    .finally(function() {
        if (isRefresh) {
            refreshBtn.disabled = false;
            refreshBtn.innerHTML = '<i class="fa-solid fa-rotate"></i> Refresh';
        }
    });
}

function displayTable(data) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    if (!data || !data.length) {
        tbody.innerHTML = `
            <tr>
                <td colspan="8" style="text-align:center;padding:25px;color:#777;">
                    <i class="fa-solid fa-users-slash"></i><br>No active records found.
                </td>
            </tr>
        `;
        return;
    }

    data.forEach(function(row, index) {
        const days = Number(row.daysLeft);
        const name = row.name || "Member";
        const uid = row.uid ? `(${row.uid})` : "";
        const expiry = row.expiryDate || "";
        const mobile = normalizeMobile(row.mobile);

        let daysHtml = "";
        let rawMessage = "";

        if (!isNaN(days) && days < 0) {
            daysHtml = `<span class="text-red">${days}</span>`;
            rawMessage = `*${name} ${uid}* आप की Eminence Library फीस दिनांक *${expiry}* को पूरी हो चुकी है, कृपया अपनी लाइब्रेरी फीस का भुगतान समय पर करें- धन्यवाद`;
        }
        else if (!isNaN(days) && days >= 0 && days <= 2) {
            daysHtml = `<span class="text-orange">${days}</span>`;
            rawMessage = `*${name} ${uid}* आप की Eminence Library फीस दिनांक *${expiry}* को पूरी हो रही है, कृपया अपनी लाइब्रेरी फीस का भुगतान समय पर करें- धन्यवाद`;
        }
        else {
            daysHtml = `<span class="text-green">${isNaN(days) ? "-" : days}</span>`;
        }

        let action = "-";

        if (!isNaN(days) && days < 0) {
            let whatsapp = "";
            if (mobile.length >= 10) {
                whatsapp = `
                    <a href="${createWhatsAppLink(mobile, rawMessage)}" target="_blank" rel="noopener" class="whatsapp-notify-btn">
                        <i class="fa-brands fa-whatsapp"></i> Send
                    </a>
                `;
            }
            action = `
                <div class="action-wrapper">
                    ${whatsapp}
                    <button class="inactive-btn" onclick="makeInactive(${index}, this)">
                        <i class="fa-solid fa-user-slash"></i> Inactive
                    </button>
                </div>
            `;
        }
        else if (!isNaN(days) && days >= 0 && days <= 2 && mobile.length >= 10) {
            action = `
                <a href="${createWhatsAppLink(mobile, rawMessage)}" target="_blank" rel="noopener" class="whatsapp-notify-btn">
                    <i class="fa-brands fa-whatsapp"></i> Send
                </a>
            `;
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td title="${escapeHtml(row.branch || "-")}">${escapeHtml(row.branch || "-")}</td>
            <td title="${escapeHtml(row.uid || "-")}">${escapeHtml(row.uid || "-")}</td>
            <td title="${escapeHtml(row.name || "-")}"><b>${escapeHtml(row.name || "-")}</b></td>
            <td>${escapeHtml(row.mobile || "-")}</td>
            <td>${escapeHtml(row.date || "-")}</td>
            <td>${escapeHtml(row.expiryDate || "-")}</td>
            <td>${daysHtml}</td>
            <td>${action}</td>
        `;
        tbody.appendChild(tr);
    });
}

function createWhatsAppLink(mobile, message) {
    const clean = normalizeMobile(mobile);
    return "https://wa.me/91" + clean + "?text=" + encodeURIComponent(message);
}

function normalizeMobile(value) {
    let mobile = String(value || "").replace(/\D/g, "");
    if (mobile.length === 12 && mobile.startsWith("91")) {
        mobile = mobile.substring(2);
    }
    if (mobile.length > 10) {
        mobile = mobile.slice(-10);
    }
    return mobile;
}

function makeInactive(index, button) {
    const member = window.allData[index];
    if (!member) {
        alert("Member data not found.");
        return;
    }

    const days = Number(member.daysLeft);
    if (isNaN(days) || days >= 0) {
        alert("Only expired members can be made inactive.");
        return;
    }

    const mobile = normalizeMobile(member.mobile);

    if (mobile.length < 10) {
        alert("Is member ka valid mobile number nahi mila, isliye WhatsApp message nahi bheja ja sakta.");
        return;
    }

    const whatsappPopup = window.open("about:blank", "_blank");

    if (!whatsappPopup) {
        alert("WhatsApp popup open nahi ho saka. Please browser me pop-ups allow karein.");
        return;
    }

    whatsappPopup.document.write(`
        <html>
        <head><title>Opening WhatsApp...</title></head>
        <body style="font-family:Arial,sans-serif;text-align:center;padding:40px;">
            <h3>Member को Inactive किया जा रहा है ...</h3>
        </body>
        </html>
    `);
    whatsappPopup.document.close();

    button.disabled = true;
    button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

    fetch(INACTIVE_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
            action: "inactiveMember",
            name: member.name || "",
            uid: member.uid || "",
            mobile: member.mobile || "",
            branch: member.branch || "",
            expiryDate: member.expiryDate || ""
        })
    })
    .then(function(response) {
        return response.json();
    })
    .then(function(result) {
        if (!result || result.status !== "success") {
            throw new Error(result && result.message ? result.message : "Unable to make inactive.");
        }

        window.allData = window.allData.filter(function(item) {
            return !sameMember(item, member);
        });

        displayTable(getFilteredData());

        const memberName = String(member.name || "Member").trim();
        const memberUid = String(member.uid || "").trim();
        const memberIdentity = memberUid ? `*${memberName} (${memberUid})*` : `*${memberName}*`;

        const inactiveMessage = `${memberIdentity} आपकी Eminence Library में सदस्यता को *Inactive* कर दिया गया है। आप भविष्य में कभी भी अपनी सदस्यता को *Active* कर सकते हैं। धन्यवाद!`;

        whatsappPopup.location.href = createWhatsAppLink(mobile, inactiveMessage);
    })
    .catch(function(error) {
        console.error("Inactive error:", error);
        try {
            whatsappPopup.close();
        } catch (e) {}

        button.disabled = false;
        button.innerHTML = '<i class="fa-solid fa-user-slash"></i> Inactive';
        alert("Member inactive nahi hua.\n" + error.message);
    });
}

function sameMember(a, b) {
    const uidA = String(a.uid || "").trim().toUpperCase();
    const uidB = String(b.uid || "").trim().toUpperCase();
    if (uidA && uidB && uidA === uidB) return true;

    const mobA = normalizeMobile(a.mobile);
    const mobB = normalizeMobile(b.mobile);
    return (mobA && mobB && mobA === mobB);
}

function filterTable() {
    displayTable(getFilteredData());
}

function getFilteredData() {
    const input = document.getElementById("searchInput");
    const query = input ? input.value.trim().toLowerCase() : "";

    if (!query) return window.allData;

    return window.allData.filter(function(row) {
        return (
            String(row.branch || "").toLowerCase().includes(query) ||
            String(row.name || "").toLowerCase().includes(query) ||
            String(row.uid || "").toLowerCase().includes(query) ||
            String(row.mobile || "").toLowerCase().includes(query)
        );
    });
}

function showCustomConfirm(message, onYes) {
    const modal = document.getElementById('customModal');
    const msgEl = document.getElementById('modalMessage');
    const yesBtn = document.getElementById('modalYesBtn');
    const noBtn = document.getElementById('modalNoBtn');

    msgEl.innerText = message;
    modal.style.display = 'flex';

    const newYesBtn = yesBtn.cloneNode(true);
    const newNoBtn = noBtn.cloneNode(true);
    yesBtn.parentNode.replaceChild(newYesBtn, yesBtn);
    noBtn.parentNode.replaceChild(newNoBtn, noBtn);

    newYesBtn.addEventListener('click', function() {
        modal.style.display = 'none';
        onYes();
    });

    newNoBtn.addEventListener('click', function() {
        modal.style.display = 'none';
    });
}

function generateBulkWhatsApp() {
    const members = window.allData.filter(function(row) {
        const days = Number(row.daysLeft);
        const mobile = normalizeMobile(row.mobile);
        return (!isNaN(days) && days <= 2 && mobile.length >= 10);
    });

    if (!members.length) {
        alert("Bulk WhatsApp ke liye koi member nahi mila.");
        return;
    }

    const confirmMessage = `${members.length} members के WhatsApp chats naye tabs mein khulne wale hain. Kya aap taiyar hain?`;

    showCustomConfirm(confirmMessage, function() {
        members.forEach(function(member, index) {
            const days = Number(member.daysLeft);
            const mobile = normalizeMobile(member.mobile);
            const uid = member.uid ? `(${member.uid})` : "";
            let message;

            if (days < 0) {
                message = `*${member.name || "Member"} ${uid}* आप की Eminence Library फीस दिनांक *${member.expiryDate || ""}* को पूरी हो चुकी है, कृपया अपनी लाइब्रेरी फीस का भुगतान समय पर करें- धन्यवाद`;
            } else {
                message = `*${member.name || "Member"} ${uid}* आप की Eminence Library फीस दिनांक *${member.expiryDate || ""}* को पूरी हो रही है, कृपया अपनी लाइब्रेरी फीस का भुगतान समय पर करें- धन्यवाद`;
            }

            const link = createWhatsAppLink(mobile, message);

            setTimeout(function() {
                window.open(link, "_blank");
            }, index * 500);
        });
    });
}

/* =====================================================
    MEMBER ACTIVATION LOGIC
===================================================== */
function openActivationModal() {
    const modal = document.getElementById("activationModal");
    modal.style.display = "flex";
    
    // Search box clear karein jab modal khule
    const searchInput = document.getElementById("activationSearchInput");
    if (searchInput) searchInput.value = "";

    fetchActivationData();
}

function closeActivationModal() {
    const modal = document.getElementById("activationModal");
    modal.style.display = "none";
}

function fetchActivationData() {
    const tbody = document.getElementById("activationTableBody");
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:20px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading master records...</td></tr>`;

    const url = GET_ACTIVATION_URL + "?action=getInactiveMembers&t=" + Date.now();

    fetch(url, { method: "GET", cache: "no-store" })
    .then(function(response) {
        if (!response.ok) throw new Error("HTTP error " + response.status);
        return response.json();
    })
    .then(function(data) {
        window.activationData = Array.isArray(data) ? data : [];
        displayActivationTable(window.activationData);
    })
    .catch(function(error) {
        console.error("Activation data error:", error);
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#dc3545;padding:20px;">Error loading data: ${escapeHtml(error.message)}</td></tr>`;
    });
}

function displayActivationTable(data) {
    const tbody = document.getElementById("activationTableBody");
    tbody.innerHTML = "";

    if (!data || !data.length) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:20px;color:#777;">No records found for activation.</td></tr>`;
        return;
    }

    data.forEach(function(row, index) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${escapeHtml(row.branch || "-")}</td>
            <td>${escapeHtml(row.uid || "-")}</td>
            <td><b>${escapeHtml(row.name || "-")}</b></td>
            <td>${escapeHtml(row.mobile || "-")}</td>
            <td>
                <button class="active-action-btn" onclick="makeActive(${index}, this)">
                    <i class="fa-solid fa-user-check"></i> Active
                </button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Search Filter Function for Activation Modal
function filterActivationTable() {
    const input = document.getElementById("activationSearchInput");
    const query = input ? input.value.trim().toLowerCase() : "";

    if (!query) {
        displayActivationTable(window.activationData);
        return;
    }

    const filtered = window.activationData.filter(function(row) {
        return (
            String(row.branch || "").toLowerCase().includes(query) ||
            String(row.name || "").toLowerCase().includes(query) ||
            String(row.uid || "").toLowerCase().includes(query) ||
            String(row.mobile || "").toLowerCase().includes(query)
        );
    });

    displayActivationTable(filtered);
}

function makeActive(index, button) {
    const activeSearchInput = document.getElementById("activationSearchInput");
    const query = activeSearchInput ? activeSearchInput.value.trim().toLowerCase() : "";
    
    let member = null;
    let originalIndex = index;

    if (query && window.activationData) {
        const filtered = window.activationData.filter(function(row) {
            return (
                String(row.branch || "").toLowerCase().includes(query) ||
                String(row.name || "").toLowerCase().includes(query) ||
                String(row.uid || "").toLowerCase().includes(query) ||
                String(row.mobile || "").toLowerCase().includes(query)
            );
        });
        member = filtered[index];
        if (member) {
            originalIndex = window.activationData.findIndex(m => 
                (m.uid && m.uid === member.uid) || (m.mobile && m.mobile === member.mobile)
            );
        }
    } else if (window.activationData) {
        member = window.activationData[index];
    }

    if (!member) {
        alert("Member data not found.");
        return;
    }

    button.disabled = true;
    button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Activating...';

    fetch(POST_ACTIVATION_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
            action: "activeMember",
            name: member.name || "",
            uid: member.uid || "",
            mobile: member.mobile || "",
            branch: member.branch || "",
            shift: member.shift || "Full Day Shift",
            expiryDate: member.expiryDate || ""
        })
    })
    .then(function(response) {
        return response.json();
    })
    .then(function(result) {
        if (!result || result.status !== "success") {
            throw new Error(result && result.message ? result.message : "Unable to activate member.");
        }

        alert("Member successfully active kar diya gaya hai aur Fee Updation sheet me save ho gaya hai!");
        
        if (originalIndex !== -1 && window.activationData) {
            window.activationData.splice(originalIndex, 1);
        }
        
        if (typeof filterActivationTable === "function") {
            filterActivationTable();
        }
        if (typeof loadData === "function") {
            loadData(false);
        }
    })
    .catch(function(error) {
        console.error("Activation error:", error);
        button.disabled = false;
        button.innerHTML = '<i class="fa-solid fa-user-check"></i> Active';
        alert("Activation failed.\n" + error.message);
    });
}
function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function goBack() {
    window.location.href = "Admin.html";
}

window.addEventListener("load", function() {
    loadData(false);
});
