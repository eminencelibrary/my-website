<!DOCTYPE html>
<html lang="en">

<head>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

        Eminence Library - Fee Management CRM
    </title>


    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }


        body {

            background-color: #f4f7f6;

            color: #333;

            padding: 15px;

        }


        .container {

            max-width: 1450px;

            background: #fff;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.05);

        }


        .banner-header {

            background-color: #ff6600;

            padding: 12px 20px;

            border-radius: 8px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

            flex-wrap: wrap;

            gap: 15px;

        }


        .banner-left {

            display: flex;

            align-items: center;

            gap: 15px;

        }


        .banner-logo {

            height: 45px;

            object-fit: contain;

        }


        .portal-badge {

            background-color: #0084d1;

            color: white;

            padding: 6px 14px;

            border-radius: 6px;

        .btn-back {

            background-color: #dc2626;

            border: none;

            padding: 8px 16px;

            border-radius: 20px;

            font-weight: 600;

            display: inline-flex;

            align-items: center;

            text-decoration: none;

        }


        .header-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

            flex-wrap: wrap;

            gap: 10px;

        }


        h2 {

            color: #2c3e50;

            font-size: 22px;

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .header-actions {

            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

        }


        .search-box {

            padding: 7px 12px;

            font-size: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            outline: none;

            width: 240px;

        }


        .search-box:focus {

            border-color: #27ae60;

        }


        .btn-refresh {

            background-color: #27ae60;

            color: white;

            border: none;

            padding: 7px 12px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 13px;

            font-weight: 500;

            display: inline-flex;

            align-items: center;

            gap: 5px;

        }


        .btn-refresh:hover {

            background-color: #219653;

        }


        .btn-bulk-whatsapp {

            background-color: #25D366;

            color: white;

            border: none;

            padding: 7px 12px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 13px;

            font-weight: 600;

            display: inline-flex;

            align-items: center;

            gap: 6px;

        }


        .btn-bulk-whatsapp:hover {

            background-color: #20ba5a;

        }


        .table-responsive {

            overflow-x: auto;

            max-height: 550px;

            overflow-y: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 5px;

            font-size: 12px;

        }


        th,
        td {

            padding: 4px 6px;

            text-align: center;

            border: 1px solid #e2e8f0;

        }


        th {

            background-color: #f8fafc;

            color: #475569;

            font-weight: 600;

            text-transform: uppercase;

            font-size: 11px;

            letter-spacing: 0.5px;

            position: sticky;

            top: 0;

            z-index: 10;

        }


        table th:nth-child(1),
        table td:nth-child(1) {

            width: 130px;

            max-width: 130px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            text-align: left;

        }


        table td:nth-child(2) {

            text-align: center;

            color: #0066cc;

        .expired-bg {

        .btn-action-expired {

        .btn-action-warning {

            font-size: 11px;

            align-items: center;

        .btn-action-warning:hover {

        }


        /* =====================================================
           INACTIVE BUTTON
           ONLY FOR EXPIRED MEMBERS

        .btn-inactive {

<body>


<div class="container">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="banner-header">


        <div class="banner-left">


            <img
                src="logo.png"
                alt="Eminence Library Logo"
                class="banner-logo"
            >


            <span class="portal-badge">

                <i class="fa-solid fa-file-invoice-dollar"></i>

                FEE MANAGEMENT PORTAL

            </span>


        </div>


        <button
            class="btn-back"
            onclick="window.history.back()"
        >

            <i class="fa-solid fa-arrow-left"></i>

            BACK

        </button>


    </div>



    <!-- =====================================================
         TITLE + ACTIONS
         ===================================================== -->

    <div class="header-bar">


        <h2>

            <i class="fa-solid fa-users-gear"></i>

            Eminence Library - Fee Tracker

        </h2>


        <div class="header-actions">


            <button
                class="btn-bulk-whatsapp"
                onclick="sendBulkWhatsApp()"
            >

                <i class="fa-brands fa-whatsapp"></i>

                Send Bulk Alerts

            </button>


            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="Filter by Branch, Name, Reg No..."
                oninput="filterTable()"
            >


            <button
                class="btn-refresh"
                onclick="fetchSheetData()"
            >

                <i class="fa-solid fa-rotate"></i>

                Refresh

            </button>


        </div>


    </div>



    <!-- =====================================================
         TABLE
         ===================================================== -->

    <div class="table-responsive">


        <table>


            <thead>

                <tr>

                    <th>
                        Branch Name
                    </th>

                    <th>
                        Reg No.
                    </th>

                    <th>
                        Name
                    </th>

                    <th>
                        Mobile Number
                    </th>

                    <th>
                        Fees Expiry Date
                    </th>

                    <th>
                        Days Left for Expiry
                    </th>

                    <th>
                        Status / Action
                    </th>

                </tr>

            </thead>


            <tbody id="memberTableBody">


                <tr>

                    <td
                        colspan="7"
                        class="loading"
                    >

                        Loading data from Google Sheets...

                    </td>

                </tr>


            </tbody>


        </table>


    </div>


</div>



<script>


/* =========================================================
   GOOGLE APPS SCRIPT URL
   ========================================================= */

const sheetApiUrl =
    "https://script.google.com/macros/s/AKfycbyqA5l6vaVQJVrDjtYugZbfLwPCjGTc68y4Dewrp9QDwXJUpfgixE-PKSjMWDmH8iFS/exec";


/* =========================================================
   GLOBAL DATA
   ========================================================= */

let globalMembersData = [];


/* =========================================================
   INACTIVE STORAGE
   ========================================================= */

const INACTIVE_STORAGE_KEY =
    "eminence_fee_tracker_inactive_members_v2";


/*
 * Get inactive member keys.
 */

function getInactiveMembers() {

    try {

        const saved =
            localStorage.getItem(
                INACTIVE_STORAGE_KEY
            );


        if (!saved) {

            return [];

        }


        const parsed =
            JSON.parse(saved);


        return Array.isArray(parsed)
            ? parsed
            : [];


    } catch (error) {

        console.error(
            "Inactive storage error:",
            error
        );

        return [];

    }

}


/*
 * Save inactive members.
 */

function saveInactiveMembers(list) {

    try {

        localStorage.setItem(
            INACTIVE_STORAGE_KEY,
            JSON.stringify(list)
        );


    } catch (error) {

        console.error(
            "Unable to save inactive member:",
            error
        );

    }

}


/* =========================================================
   MEMBER KEY
   ========================================================= */

function getMemberKey(member) {


    const uid =
        String(

            member["UID Code"] ||

            member["Reg No."] ||

            member["RegNo"] ||

            member["UID"] ||

            ""

        )
        .trim()
        .toLowerCase();


    const mobile =
        String(

            member["Mobile Number"] ||

            member["Mobile"] ||

            member["Phone"] ||

            ""

        )
        .replace(/\D/g, "");


    /*
     * UID is preferred.
     */

    if (uid) {

        return "UID_" + uid;

    }


    /*
     * Mobile fallback.
     */

    if (mobile) {

        return "MOBILE_" + mobile;

    }


    /*
     * Name fallback.
     */

    const name =
        String(

            member["Member Name"] ||

            member["Name"] ||

            ""

        )
        .trim()
        .toLowerCase();


    if (name) {

        return "NAME_" + name;

    }


    return "";

}


/* =========================================================
   CHECK INACTIVE
   ========================================================= */

function isMemberInactive(member) {

    const key =
        getMemberKey(member);


    if (!key) {

        return false;

    }


    return getInactiveMembers()
        .includes(key);

}


/* =========================================================
   MARK MEMBER INACTIVE
   ========================================================= */

function markMemberInactive(member) {


    /*
     * Safety check.
     *
     * Inactive can ONLY be applied to expired member.
     */

    if (!member) {

        return;

    }


    const days =
        member.calculatedDays !== undefined

            ? Number(
                member.calculatedDays
            )

            : getDaysDifference(member);


    /*
     * VERY IMPORTANT
     *
     * If member is not expired,
     * do absolutely nothing.
     */

    if (
        isNaN(days) ||
        days >= 0
    ) {

        return;

    }


    const key =
        getMemberKey(member);


    if (!key) {

        return;

    }


    let inactiveMembers =
        getInactiveMembers();


    /*
     * Already inactive
     */

    if (
        inactiveMembers.includes(key)
    ) {

        return;

    }


    inactiveMembers.push(key);


    saveInactiveMembers(
        inactiveMembers
    );


    /*
     * ONLY ONE MESSAGE.
     */

    alert("Member inactive");


    /*
     * Immediately remove row.
     */

    const searchQuery =
        document.getElementById(
            "searchInput"
        ).value || "";


    processAndRenderTable(
        globalMembersData,
        searchQuery
    );

}


/* =========================================================
   FETCH SHEET DATA
   ========================================================= */

async function fetchSheetData() {


    const tbody =
        document.getElementById(
            "memberTableBody"
        );


    tbody.innerHTML = `

        <tr>

            <td
                colspan="7"
                class="loading"
            >

                <i class="fa-solid fa-spinner fa-spin"></i>

                Fetching data...

            </td>

        </tr>

    `;


    try {


        const url =
            sheetApiUrl +
            "?t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        let rows = [];


        if (Array.isArray(data)) {

            rows = data;

        }

        else if (
            data &&
            typeof data === "object"
        ) {

            if (
                Array.isArray(
                    data.history
                )
            ) {

                rows =
                    data.history;

            }

            else if (
                Array.isArray(
                    data.data
                )
            ) {

                rows =
                    data.data;

            }

            else if (
                Array.isArray(
                    data.records
                )
            ) {

                rows =
                    data.records;

            }

            else if (
                Array.isArray(
                    data.rows
                )
            ) {

                rows =
                    data.rows;

            }

        }


        /*
         * Calculate Days Left again on frontend.
         *
         * This protects us if another API version
         * returns a stale Days Left value.
         */

        globalMembersData =
            rows
                .filter(
                    member =>
                        member &&
                        typeof member === "object"
                )
                .map(
                    member => {

                        return {

                            ...member,

                            calculatedDays:
                                getDaysDifference(
                                    member
                                )

                        };

                    }
                );


        processAndRenderTable(
            globalMembersData
        );


    } catch (error) {


        console.error(
            "Error fetching data:",
            error
        );


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="error"
                >

                    Failed to load data from Google Sheets.

                    <br>

                    ${escapeHtml(
                        error.message
                    )}

                </td>

            </tr>

        `;

    }

}


/* =========================================================
   GET VALUE
   ========================================================= */

function getMemberValue(
    member,
    possibleKeys
) {


    for (
        const key of possibleKeys
    ) {


        if (
            member[key] !== undefined &&
            member[key] !== null &&
            String(
                member[key]
            ).trim() !== ""
        ) {

            return member[key];

        }

    }


    /*
     * Case-insensitive fallback.
     */

    const allKeys =
        Object.keys(member);


    for (
        const wanted of possibleKeys
    ) {


        const wantedClean =
            String(wanted)
                .trim()
                .toLowerCase();


        const matchingKey =
            allKeys.find(
                key =>
                    String(key)
                        .trim()
                        .toLowerCase() ===
                    wantedClean
            );


        if (
            matchingKey &&
            member[matchingKey] !== undefined &&
            member[matchingKey] !== null
        ) {

            return member[matchingKey];

        }

    }


    return "";

}


/* =========================================================
   DATE FORMAT
   ========================================================= */

function formatDisplayDate(dateStr) {


    if (!dateStr) {

        return "";

    }


    const str =
        String(dateStr).trim();


    /*
     * DD-MM-YYYY
     */

    if (
        /^\d{2}-\d{2}-\d{4}$/
            .test(str)
    ) {

        return str;

    }


    /*
     * DD/MM/YYYY
     */

    let match =
        str.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );


    if (match) {

        return (

            String(match[1])
                .padStart(2, "0")

            +

            "-" +

            String(match[2])
                .padStart(2, "0")

            +

            "-" +

            match[3]

        );

    }


    /*
     * YYYY-MM-DD
     */

    match =
        str.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );


    if (match) {

        return (

            String(match[3])
                .padStart(2, "0")

            +

            "-" +

            String(match[2])
                .padStart(2, "0")

            +

            "-" +

            match[1]

        );

    }


    /*
     * ISO timestamp.
     *
     * Do NOT use new Date() here first.
     * This avoids timezone date shifting.
     */

    match =
        str.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})T/
        );


    if (match) {

        return (

            String(match[3])
                .padStart(2, "0")

            +

            "-" +

            String(match[2])
                .padStart(2, "0")

            +

            "-" +

            match[1]

        );

    }


    /*
     * Last fallback.
     */

    const date =
        new Date(str);


    if (
        !isNaN(
            date.getTime()
        )
    ) {

        return (

            String(
                date.getDate()
            )
            .padStart(2, "0")

            +

            "-" +

            String(
                date.getMonth() + 1
            )
            .padStart(2, "0")

            +

            "-" +

            date.getFullYear()

        );

    }


    return str;

}


/* =========================================================
   PARSE DATE WITHOUT TIMEZONE PROBLEM
   ========================================================= */

function parseExpiryDate(value) {


    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ) {

        return null;

    }


    const str =
        String(value).trim();


    /*
     * DD-MM-YYYY
     */

    let match =
        str.match(
            /^(\d{1,2})-(\d{1,2})-(\d{4})$/
        );


    if (match) {

        return new Date(
            Number(match[3]),
            Number(match[2]) - 1,
            Number(match[1])
        );

    }


    /*
     * DD/MM/YYYY
     */

    match =
        str.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );


    if (match) {

        return new Date(
            Number(match[3]),
            Number(match[2]) - 1,
            Number(match[1])
        );

    }


    /*
     * YYYY-MM-DD
     */

    match =
        str.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );


    if (match) {

        return new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
        );

    }


    /*
     * ISO date
     */

    match =
        str.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})T/
        );


    if (match) {

        return new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
        );

    }


    return null;

}


/* =========================================================
   DAYS DIFFERENCE
   ========================================================= */

function getDaysDifference(member) {


    /*
     * FIRST: calculate directly from Expiry Date.
     *
     * We intentionally do NOT trust an old "Days Left"
     * column because it can become stale.
     */

    const expiryRaw =
        getMemberValue(
            member,
            [
                "Expiry Date",
                "expiryDate",
                "Fees Expiry Date",
                "Fees_Expiry_Date",
                "Expiry"
            ]
        );


    if (expiryRaw) {


        const expiryDate =
            parseExpiryDate(
                expiryRaw
            );


        if (expiryDate) {


            const now =
                new Date();


            /*
             * Today at local midnight.
             */

            const today =
                new Date(
                    now.getFullYear(),
                    now.getMonth(),
                    now.getDate()
                );


            const expiry =
                new Date(
                    expiryDate.getFullYear(),
                    expiryDate.getMonth(),
                    expiryDate.getDate()
                );


            const difference =
                expiry.getTime() -
                today.getTime();


            return Math.round(
                difference /
                (
                    1000 *
                    60 *
                    60 *
                    24
                )
            );

        }

    }


    /*
     * Fallback only if expiry date is missing.
     */

    const daysVal =
        getMemberValue(
            member,
            [
                "Days Left",
                "Days_Left",
                "daysLeft"
            ]
        );


    if (
        daysVal !== "" &&
        daysVal !== null &&
        daysVal !== undefined &&
        !isNaN(daysVal)
    ) {

        return parseInt(
            daysVal,
            10
        );

    }


    return NaN;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {


    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   RENDER TABLE
   ========================================================= */

function processAndRenderTable(
    rawMembers,
    searchQuery = ""
) {


    const tbody =
        document.getElementById(
            "memberTableBody"
        );


    tbody.innerHTML = "";


    if (
        !Array.isArray(rawMembers) ||
        rawMembers.length === 0
    ) {


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    style="text-align:center;"
                >

                    No members found in sheet.

                </td>

            </tr>

        `;


        return;

    }


    /*
     * Prepare members.
     */

    let processedMembers =
        rawMembers.map(
            member => {

                return {

                    ...member,

                    calculatedDays:
                        getDaysDifference(
                            member
                        )

                };

            }
        );


    /*
     * REMOVE INACTIVE MEMBERS
     */

    processedMembers =
        processedMembers.filter(
            member =>
                !isMemberInactive(member)
        );


    /*
     * SEARCH
     */

    const query =
        String(
            searchQuery || ""
        )
        .trim()
        .toLowerCase();


    if (query) {


        processedMembers =
            processedMembers.filter(
                member => {


                    const branchName =
                        String(
                            getMemberValue(
                                member,
                                [
                                    "Branch",
                                    "Branch Name"
                                ]
                            )
                        )
                        .toLowerCase();


                    const regNo =
                        String(
                            getMemberValue(
                                member,
                                [
                                    "UID Code",
                                    "Reg No.",
                                    "RegNo",
                                    "Registration No"
                                ]
                            )
                        )
                        .toLowerCase();


                    const name =
                        String(
                            getMemberValue(
                                member,
                                [
                                    "Member Name",
                                    "Name",
                                    "Student Name"
                                ]
                            )
                        )
                        .toLowerCase();


                    const mobile =
                        String(
                            getMemberValue(
                                member,
                                [
                                    "Mobile Number",
                                    "Mobile",
                                    "Phone"
                                ]
                            )
                        )
                        .toLowerCase();


                    return (

                        branchName.includes(query) ||

                        regNo.includes(query) ||

                        name.includes(query) ||

                        mobile.includes(query)

                    );

                }
            );

    }


    /*
     * SORT
     *
     * Expired first.
     */

    processedMembers.sort(
        (a, b) => {

            const da =
                isNaN(
                    a.calculatedDays
                )
                    ? 999999
                    : a.calculatedDays;


            const db =
                isNaN(
                    b.calculatedDays
                )
                    ? 999999
                    : b.calculatedDays;


            return da - db;

        }
    );


    if (
        processedMembers.length === 0
    ) {


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    style="text-align:center;"
                >

                    No matching members found.

                </td>

            </tr>

        `;


        return;

    }


    /*
     * CREATE ROWS
     */

    processedMembers.forEach(
        member => {


            const branchName =
                getMemberValue(
                    member,
                    [
                        "Branch",
                        "Branch Name"
                    ]
                );


            const regNo =
                getMemberValue(
                    member,
                    [
                        "UID Code",
                        "Reg No.",
                        "RegNo",
                        "Registration No"
                    ]
                );


            const name =
                getMemberValue(
                    member,
                    [
                        "Member Name",
                        "Name",
                        "Student Name"
                    ]
                );


            const mobile =
                String(
                    getMemberValue(
                        member,
                        [
                            "Mobile Number",
                            "Mobile",
                            "Phone"
                        ]
                    )
                ).trim();


            const expiryRaw =
                getMemberValue(
                    member,
                    [
                        "Expiry Date",
                        "expiryDate",
                        "Fees Expiry Date",
                        "Fees_Expiry_Date",
                        "Expiry"
                    ]
                );


            if (!expiryRaw) {

                return;

            }


            const expiryFormatted =
                formatDisplayDate(
                    expiryRaw
                );


            const diffDays =
                member.calculatedDays;


            let daysClass = "";

            let statusActionHTML = "";


            /*
             * MOBILE
             */

            const cleanMobile =
                mobile.replace(
                    /\D/g,
                    ""
                );


            /*
             * =================================================
             * EXPIRED
             * =================================================
             *
             * ONLY HERE:
             *
             * Send Alert
             * +
             * Inactive
             */

            if (
                !isNaN(diffDays) &&
                diffDays < 0
            ) {


                daysClass =
                    "expired-bg";


                statusActionHTML = `

                    <div
                        class="action-container"
                    >


                        <button
                            class="btn-action-expired"
                            onclick="sendWhatsAppByMember(this)"
                            data-mobile="${escapeHtml(cleanMobile)}"
                            data-name="${escapeHtml(name)}"
                            data-reg="${escapeHtml(regNo)}"
                            data-expiry="${escapeHtml(expiryFormatted)}"
                            data-days="${diffDays}"
                        >

                            <i
                                class="fa-brands fa-whatsapp"
                            ></i>

                            Send Alert

                        </button>


                        <button
                            class="btn-inactive"
                            onclick="inactiveFromButton(this)"
                            data-member-key="${escapeHtml(getMemberKey(member))}"
                        >

                            <i
                                class="fa-solid fa-user-slash"
                            ></i>

                            INACTIVE

                        </button>


                    </div>

                `;

            }


            /*
             * =================================================
             * EXPIRING TODAY / 1 / 2 DAYS
             * =================================================
             *
             * NO INACTIVE BUTTON
             */

            else if (
                !isNaN(diffDays) &&
                diffDays >= 0 &&
                diffDays <= 2
            ) {


                daysClass =
                    "expiring-soon-bg";


                statusActionHTML = `

                    <button
                        class="btn-action-warning"
                        onclick="sendWhatsAppByMember(this)"
                        data-mobile="${escapeHtml(cleanMobile)}"
                        data-name="${escapeHtml(name)}"
                        data-reg="${escapeHtml(regNo)}"
                        data-expiry="${escapeHtml(expiryFormatted)}"
                        data-days="${diffDays}"
                    >

                        <i
                            class="fa-brands fa-whatsapp"
                        ></i>

                        Send Alert

                    </button>

                `;

            }


            /*
             * =================================================
             * ACTIVE
             * =================================================
             */

            else {


                statusActionHTML = `

                    <span
                        class="active-badge"
                    >

                        <i
                            class="fa-solid fa-circle-check"
                        ></i>

                        Subscription Active

                    </span>

                `;

            }


            /*
             * CREATE ROW
             */

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    <b>
                        ${escapeHtml(branchName)}
                    </b>
                </td>


                <td>
                    ${escapeHtml(regNo)}
                </td>


                <td>
                    <b>
                        ${escapeHtml(name)}
                    </b>
                </td>


                <td>
                    ${escapeHtml(mobile)}
                </td>


                <td>
                    ${escapeHtml(expiryFormatted)}
                </td>


                <td class="${daysClass}">

                    ${
                        isNaN(diffDays)
                            ? "N/A"
                            : diffDays
                    }

                </td>


                <td>
                    ${statusActionHTML}
                </td>

            `;


            tbody.appendChild(
                row
            );

        }
    );


    /*
     * Check if rows were actually added.
     */

    if (
        tbody.children.length === 0
    ) {


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    style="text-align:center;"
                >

                    No matching members found.

                </td>

            </tr>

        `;

    }

}


/* =========================================================
   INACTIVE BUTTON HANDLER
   ========================================================= */

function inactiveFromButton(button) {


    const memberKey =
        button.dataset.memberKey;


    if (!memberKey) {

        return;

    }


    /*
     * Find original member.
     */

    const member =
        globalMembersData.find(
            m =>
                getMemberKey(m) ===
                memberKey
        );


    if (!member) {

        return;

    }


    /*
     * IMPORTANT:
     *
     * We again verify that member is expired.
     */

    const days =
        getDaysDifference(
            member
        );


    if (
        isNaN(days) ||
        days >= 0
    ) {

        return;

    }


    /*
     * Mark inactive.
     */

    markMemberInactive(
        {
            ...member,
            calculatedDays: days
        }
    );

}


/* =========================================================
   SEARCH
   ========================================================= */

function filterTable() {


    const query =
        document.getElementById(
            "searchInput"
        ).value;


    processAndRenderTable(
        globalMembersData,
        query
    );

}


/* =========================================================
   SINGLE WHATSAPP
   ========================================================= */

function sendWhatsAppByMember(
    button
) {


    const mobile =
        button.dataset.mobile || "";


    const name =
        button.dataset.name || "Member";


    const regNo =
        button.dataset.reg || "";


    const expiryDate =
        button.dataset.expiry || "";


    const days =
        Number(
            button.dataset.days
        );


    sendWhatsApp(
        mobile,
        name,
        regNo,
        expiryDate,
        days
    );

}


/* =========================================================
   SINGLE WHATSAPP
   ========================================================= */

function sendWhatsApp(
    mobile,
    name,
    regNo,
    expiryDate,
    days
) {


    if (!mobile) {


        alert(
            "Mobile number is missing or invalid!"
        );


        return;

    }


    let message = "";


    if (
        Number(days) < 0
    ) {


        message =
            `${name} (${regNo}) आप की Eminence Library फीस दिनांक ${expiryDate} को पूरी हो चुकी है, कृपया अपनी लाइब्रेरी फीस का भुगतान समय पर करें- धन्यवाद`;

    }


    else {


        message =
            `${name} (${regNo}) आप की Eminence Library फीस दिनांक ${expiryDate} को पूरी हो रही है, कृपया अपनी लाइब्रेरी फीस का भुगतान समय पर करें- धन्यवाद`;

    }


    let formattedMobile =
        String(mobile)
            .replace(
                /\D/g,
                ""
            );


    if (
        !formattedMobile.startsWith("91") &&
        formattedMobile.length === 10
    ) {

        formattedMobile =
            "91" +
            formattedMobile;

    }


    const whatsappUrl =
        `https://api.whatsapp.com/send?phone=${formattedMobile}&text=${encodeURIComponent(message)}`;


    window.open(
        whatsappUrl,
        "_blank"
    );

}


/* =========================================================
   BULK WHATSAPP
   ========================================================= */

function sendBulkWhatsApp() {


    if (
        !globalMembersData ||
        globalMembersData.length === 0
    ) {


        alert(
            "डेटा लोड नहीं हुआ है या कोई डेटा उपलब्ध नहीं है!"
        );


        return;

    }


    /*
     * ONLY expired OR expiring within 2 days.
     *
     * Inactive members are automatically excluded.
     */

    const targetMembers =
        globalMembersData.filter(
            member => {


                if (
                    isMemberInactive(member)
                ) {

                    return false;

                }


                const days =
                    getDaysDifference(
                        member
                    );


                return (
                    !isNaN(days) &&
                    days <= 2
                );

            }
        );


    if (
        targetMembers.length === 0
    ) {


        alert(
            "कोई भी ऐसा मेंबर नहीं है जिसकी फीस एक्सपायर हुई हो या नज़दीक हो!"
        );


        return;

    }


    const confirmSend =
        confirm(

            `कुल ${targetMembers.length} सदस्यों की फीस एक्सपायर या समाप्त होने वाली है। क्या आप इन्हें एक-एक करके WhatsApp मैसेज भेजना चाहते हैं?`

        );


    if (!confirmSend) {

        return;

    }


    /*
     * WhatsApp tabs.
     */

    targetMembers.forEach(
        (
            member,
            index
        ) => {


            const name =
                getMemberValue(
                    member,
                    [
                        "Member Name",
                        "Name",
                        "Student Name"
                    ]
                ) || "Member";


            const regNo =
                getMemberValue(
                    member,
                    [
                        "UID Code",
                        "Reg No.",
                        "RegNo"
                    ]
                );


            const mobile =
                String(
                    getMemberValue(
                        member,
                        [
                            "Mobile Number",
                            "Mobile",
                            "Phone"
                        ]
                    )
                ).trim();


            const expiryRaw =
                getMemberValue(
                    member,
                    [
                        "Expiry Date",
                        "expiryDate",
                        "Fees Expiry Date",
                        "Fees_Expiry_Date",
                        "Expiry"
                    ]
                );


            const expiryDate =
                formatDisplayDate(
                    expiryRaw
                );


            const days =
                getDaysDifference(
                    member
                );


            if (!mobile) {

                return;

            }


            let cleanMobile =
                mobile.replace(
                    /\D/g,
                    ""
                );


            if (
                !cleanMobile.startsWith("91") &&
                cleanMobile.length === 10
            ) {

                cleanMobile =
                    "91" +
                    cleanMobile;

            }


            let message = "";


            if (
                days < 0
            ) {


                message =
                    `*${name} (${regNo})* आप की Eminence Library फीस दिनांक *${expiryDate}* को पूरी हो चुकी है, कृपया अपनी लाइब्रेरी फीस का भुगतान समय पर करें- धन्यवाद`;

            }


            else {


                message =
                    `*${name} (${regNo})* आप की Eminence Library फीस दिनांक *${expiryDate}* को पूरी हो रही है, कृपया अपनी लाइब्रेरी फीस का भुगतान समय पर करें- धन्यवाद`;

            }


            setTimeout(
                () => {


                    const whatsappUrl =
                        `https://api.whatsapp.com/send?phone=${cleanMobile}&text=${encodeURIComponent(message)}`;


                    window.open(
                        whatsappUrl,
                        "_blank"
                    );


                },
                index * 1000
            );

        }
    );

}

    function() {

        fetchSheetData();

    }
);
